<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>call and response</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        h1 {
            font-weight: normal;
            font-size: 1.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .score-board {
            font-size: 1.25rem;
            margin-bottom: 10px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 0 10px;
            display: flex;
            justify-content: center;
        }

        canvas {
            background-color: #000000;
            border: 1px solid #ffffff;
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
            touch-action: none;
        }

        .controls {
            margin-top: 15px;
        }

        button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
        }

        button:active {
            background: #cccccc;
        }


        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(128, 128, 128, 0.6);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .popup {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 25px;
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        .popup h2 {
            font-weight: normal;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .popup p {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
    </style>
</head>
